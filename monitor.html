<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Isaac-T Monitor</title>
<meta http-equiv="refresh" content="5">
<style>
body { background:#0f172a; color:#e2e8f0; font-family:monospace; padding:20px; }
h1 { color:#38bdf8; }
pre { background:#1e293b; padding:15px; border-radius:8px; white-space:pre-wrap; }
.up { color:#4ade80; } .down { color:#f87171; }
</style>
</head>
<body>
<h1>Isaac-T Network Monitor — LIVE</h1>
<pre id="log">Loading...</pre>
<script>
async function load() {
  try {
    let r = await fetch('connection_log.txt?t='+Date.now());
    let t = await r.text();
    document.getElementById('log').innerHTML = t.split('\n').slice(-100).map(l => {
      if(l.includes(' UP')) return `<span class="up">${l}</span>`;
      if(l.includes(' DOWN')) return `<span class="down">${l}</span>`;
      return l;
    }).join('\n');
  } catch(e){ document.getElementById('log').textContent = 'Failed to load log: '+e; }
}
load(); setInterval(load, 2000);
</script>
</body>
</html>
